<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>196dev components</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #050208; color: #f2e8d4; font: 15px/1.5 system-ui, sans-serif; }
    header { padding: 48px 24px 24px; max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-weight: 500; letter-spacing: -.02em; }
    p { margin: 0; opacity: .7; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 24px; max-width: 1200px; margin: 0 auto; }
    figure { margin: 0; }
    .hero { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: #050208; border: 1px solid #ffffff1a; }
    .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    figcaption { padding: 8px 2px; font: 12px/1.4 ui-monospace, monospace; opacity: .7; }
  </style>
</head>
<body>
  <header>
    <h1>196dev components</h1>
    <p>Niche components you look for and can't find anywhere. Each one is a single ES module: <code>mount(canvas, options)</code>. Hover and click the previews.</p>
  </header>
  <main id="grid"></main>
  <script type="module">
    const SCENES = [
      ["hero-chrome.js", "mount", {}],
      ["hero-ebru.js", "mount", { drip: 4 }],
      ["hero-guilloche.js", "mount", {}],
      ["hero-halftone.js", "mount", {}],
      ["hero-ascii.js", "mount", {}],
      ["hero-contour.js", "mount", {}],
      ["hero-network.js", "mount", {}],
      ["tokens.js", "mountTokens", {}]
    ];
    const grid = document.getElementById("grid");
    for (const [file, fn, opts] of SCENES) {
      const fig = document.createElement("figure");
      fig.innerHTML = `<div class="hero"><canvas></canvas></div><figcaption>${file}</figcaption>`;
      grid.append(fig);
      import(`./${file}`).then((m) => m[fn](fig.querySelector("canvas"), opts))
        .catch((err) => console.warn(file, err));
    }
  </script>
</body>
</html>
